name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  FLATBUFFERS_VERSION: 25.12.19
  FLATBUFFERS_SHA256: 9f87066dc5dfa7fe02090b55bab5f3e55df03e32c9b0cdf229004ade7d091039
  # Keep in step with ZIG_VERSION in crates/embers-ghostty-sys/ghostty_source.rs
  # and BINDGEN_VERSION in crates/embers-ghostty-gen.
  ZIG_VERSION: 0.16.0
  BINDGEN_VERSION: 0.72.1

jobs:
  fmt-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-flatc
        with:
          version: ${{ env.FLATBUFFERS_VERSION }}
          sha256: ${{ env.FLATBUFFERS_SHA256 }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install mdBook
        run: cargo install mdbook --version 0.5.2 --locked
      - name: Run unit and integration tests
        run: cargo test --workspace
      - name: Regenerate config API docs
        run: cargo gen-docs
      - name: Verify checked-in config API docs
        run: |
          status="$(git status --porcelain -- docs/config-api docs/config-api-book)"
          if [ -n "$status" ]; then
            echo "Config API docs are out of date after regeneration:"
            printf '%s\n' "$status"
            exit 1
          fi
      - name: Regenerate protocol code
        run: cargo gen-protocol
      - name: Verify checked-in protocol code
        run: |
          status="$(git status --porcelain -- crates/embers-protocol/src/generated)"
          if [ -n "$status" ]; then
            echo "Generated protocol code is out of date after regeneration:"
            printf '%s\n' "$status"
            exit 1
          fi

  pty-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run ignored PTY smoke test
        run: cargo test -p embers-test-support pty_round_trips_input -- --ignored

  # The Ghostty crates are outside the workspace, since building them needs Zig.
  ghostty:
    runs-on: ubuntu-latest
    env:
      # Shared, so libghostty-vt is built once for both crates.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install bindgen
        run: cargo install bindgen-cli --version "${BINDGEN_VERSION}" --locked
      - name: Regenerate libghostty-vt bindings
        run: cargo gen-ghostty
      - name: Verify checked-in libghostty-vt bindings
        run: |
          status="$(git status --porcelain -- crates/embers-ghostty-sys/src/bindings.rs)"
          if [ -n "$status" ]; then
            echo "libghostty-vt bindings are out of date after regeneration:"
            git diff --stat -- crates/embers-ghostty-sys/src/bindings.rs
            exit 1
          fi
      - name: Check formatting
        run: |
          for crate in embers-ghostty-sys embers-ghostty-backend; do
            cargo fmt --manifest-path "crates/${crate}/Cargo.toml" -- --check
          done
      - name: Lint
        run: |
          for crate in embers-ghostty-sys embers-ghostty-backend; do
            cargo clippy --locked --manifest-path "crates/${crate}/Cargo.toml" --all-targets -- -D warnings
          done
      - name: Test
        run: |
          for crate in embers-ghostty-sys embers-ghostty-backend; do
            cargo test --locked --manifest-path "crates/${crate}/Cargo.toml"
          done
