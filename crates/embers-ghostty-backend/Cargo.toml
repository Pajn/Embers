[package]
name = "embers-ghostty-backend"
description = "An Embers terminal backend on libghostty-vt, Ghostty's terminal emulation, to try beside the alacritty one."
publish = false
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/Pajn/Embers"
rust-version = "1.92"
version = "0.0.0"

[lib]
doctest = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
embers-cli = { path = "../embers-cli" }
embers-core = { path = "../embers-core" }
embers-ghostty-sys = { path = "../embers-ghostty-sys" }
embers-server = { path = "../embers-server" }
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
embers-client = { path = "../embers-client" }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-segmentation = "1.12"
unicode-width = "0.2"
